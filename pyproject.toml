[project]
name = "ai-usage-clock"
version = "1.0.0"
description = "Compact cross-platform desktop monitor for Claude, Codex, Antigravity, OpenCode Go, GitHub Copilot, and OpenRouter usage, with quota reset alerts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "docs/legal/UPSTREAM-LICENSE.txt"]
authors = [{ name = "AI Usage Clock contributors" }]
keywords = ["ai", "desktop", "usage-monitor", "claude", "codex", "copilot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.7,<7",
    "PyQt6-WebEngine>=6.7,<7",
    "requests>=2.32",
    "websocket-client>=1.8",
    "pydantic>=2.6",
    "keyring>=25.0",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    "winrt-runtime>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2,<4; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=3.2,<4; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/AIUsageClock/ai-usage-clock"
Repository = "https://github.com/AIUsageClock/ai-usage-clock"
Issues = "https://github.com/AIUsageClock/ai-usage-clock/issues"
Security = "https://github.com/AIUsageClock/ai-usage-clock/security"

[project.optional-dependencies]
mcp = [
    "mcp>=1.27,<2",
]
dev = [
    "mcp>=1.27,<2",
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "responses>=0.25",
    "pyinstaller>=6.6",
]

[project.scripts]
ai-usage-clock = "aiusageclock.__main__:main"
ai-usage-clock-mcp = "aiusageclock.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiusageclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyqt6"
