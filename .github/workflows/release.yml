name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.18"
      - id: ver
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            tag_version="${tag#v}"
            if [ "$tag_version" != "$version" ]; then
              echo "tag version $tag_version != pyproject.toml version $version" >&2
              exit 1
            fi
            echo "Tag and pyproject agree on $version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Confirm tag matches pyproject version (tag pushes only)
        if: github.event_name == 'push'
        shell: bash
        run: |
          test "${GITHUB_REF_NAME#v}" = "${{ steps.ver.outputs.version }}"

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            label: windows
            archive_ext: zip
            build_cmd: ./build.ps1
          - os: macos-26
            label: macos
            archive_ext: tar.gz
            build_cmd: ./build.sh
          - os: ubuntu-22.04
            label: linux
            archive_ext: tar.gz
            build_cmd: ./build.sh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The CI Python is pinned to an exact patch release here (and in the other
      # python-version lines of the workflows); .python-version (3.14) is only for
      # local development. Upgrade steps: docs/build.md.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"

      - name: Set up Node.js 24.22.2 for extractor tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Confirm Node.js runtime
        run: node --version

      # Creates .venv from uv.lock (the Python is the one set up above; uv may
      # not download another). --frozen fails instead of re-resolving when the
      # lock and pyproject.toml disagree. The later steps and build.ps1 /
      # build.sh use the interpreter in .venv directly.
      - name: Install locked dependencies + dev extras
        shell: bash
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --extra dev

      - name: Install Linux Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Minimum runtime libs PyQt6's xcb plugin links against on Ubuntu
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3 libxss1 libasound2 libdrm2 libgbm1 \
              libxkbfile1 libxshmfence1

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          .\.venv\Scripts\python.exe tools\check_versions.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tests (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          .venv/bin/python tools/check_versions.py
          .venv/bin/python -m pytest -q

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.build_cmd }}

      - name: Build (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x ./build.sh
          ${{ matrix.build_cmd }}

      - name: Smoke test MCP helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\smoke_test_mcp.py dist\ai-usage-clock\ai-usage-clock-mcp.exe

      - name: Smoke test MCP helper (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/smoke_test_mcp.py dist/ai-usage-clock-mcp

      - name: Smoke test MCP helper (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/smoke_test_mcp.py dist/ai-usage-clock/ai-usage-clock-mcp

      - name: Smoke test packaged GUI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.venv\Scripts\python.exe tools\smoke_test_gui.py dist\ai-usage-clock

      - name: Smoke test packaged GUI (macOS)
        if: runner.os == 'macOS'
        run: .venv/bin/python tools/smoke_test_gui.py dist/ai-usage-clock.app

      - name: Smoke test packaged GUI (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python tools/smoke_test_gui.py dist/ai-usage-clock

      # The GUI smoke test above turns every provider off, so it never starts
      # the browser worker; the trimmed packaged build could lose a WebEngine
      # module without any other step noticing. This runs the worker from the
      # packaged program: it loads a data: page, runs one line of JavaScript
      # and exits 0 on success (3 if the session has no OpenGL).
      - name: Smoke test packaged WebEngine worker (Windows)
        timeout-minutes: 10
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: |
          # A windowed exe has no console to read: wait for it and use its exit code.
          $exe = (Resolve-Path "dist\ai-usage-clock\ai-usage-clock.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList "--webengine-worker", "--selftest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "packaged WebEngine worker self-test failed (exit code $($process.ExitCode))" }

      - name: Smoke test packaged WebEngine worker (macOS)
        timeout-minutes: 10
        if: runner.os == 'macOS'
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: dist/ai-usage-clock.app/Contents/MacOS/ai-usage-clock --webengine-worker --selftest

      - name: Smoke test packaged WebEngine worker (Linux, virtual display)
        timeout-minutes: 10
        if: runner.os == 'Linux'
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: xvfb-run -a dist/ai-usage-clock/ai-usage-clock --webengine-worker --selftest

      - name: Package (Windows zip + sha256)
        id: pack_win
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ needs.resolve-version.outputs.version }}"
          $zipName = "ai-usage-clock-$version-windows.zip"
          $shaName = "$zipName.sha256"
          Compress-Archive -Path dist\ai-usage-clock -DestinationPath $zipName -Force
          # The license files must ship inside the archive, next to the exe.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName).Path)
          try {
              $entries = @($zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' })
          } finally {
              $zip.Dispose()
          }
          foreach ($required in @("ai-usage-clock/LICENSE", "ai-usage-clock/THIRD_PARTY_NOTICES.txt")) {
              if ($entries -notcontains $required) { throw "$required is missing from $zipName" }
          }
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          # LF line ending, ASCII, no BOM: `sha256sum -c` rejects the CRLF that
          # Out-File writes on a Windows runner.
          [System.IO.File]::WriteAllText((Join-Path (Get-Location).Path $shaName), "$sha *$zipName`n", [System.Text.Encoding]::ASCII)
          "archive=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$shaName"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Package (macOS / Linux tar.gz + sha256)
        id: pack_unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${{ needs.resolve-version.outputs.version }}"
          archive="ai-usage-clock-${version}-${{ matrix.label }}.tar.gz"
          sha="${archive}.sha256"
          # On mac, archive the .app bundle. On Linux, archive the dist folder.
          if [ "${{ runner.os }}" = "macOS" ]; then
              tar -C dist -czf "$archive" ai-usage-clock.app ai-usage-clock-mcp LICENSE THIRD_PARTY_NOTICES.txt
              prefix=""
          else
              tar -C dist -czf "$archive" ai-usage-clock
              prefix="ai-usage-clock/"
          fi
          # The license files must ship inside the archive, next to the app.
          listing="$(tar -tzf "$archive")"
          for required in LICENSE THIRD_PARTY_NOTICES.txt; do
              if ! grep -qxF "${prefix}${required}" <<< "$listing"; then
                  echo "${prefix}${required} is missing from $archive" >&2
                  exit 1
              fi
          done
          shasum -a 256 "$archive" | awk '{print $1 " *" $2}' > "$sha"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha=$sha"         >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ai-usage-clock-${{ matrix.label }}
          path: |
            ai-usage-clock-*.${{ matrix.archive_ext }}
            ai-usage-clock-*.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error

  release:
    needs: [resolve-version, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p release
          find artifacts -mindepth 2 -type f -exec mv -t release {} +
          ls -la release

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: AI Usage Clock ${{ needs.resolve-version.outputs.version }}
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Highlights

            _Replace this section with 3-5 user-facing highlights for this release before publishing the draft._

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ needs.resolve-version.outputs.tag }}/CHANGELOG.md) for full notes.

            **Downloads** (pick the artifact for your OS, extract, and run):
            - Windows: `ai-usage-clock-${{ needs.resolve-version.outputs.version }}-windows.zip`, run `ai-usage-clock.exe`
            - macOS:   `ai-usage-clock-${{ needs.resolve-version.outputs.version }}-macos.tar.gz`, drag `ai-usage-clock.app` to Applications
            - Linux:   `ai-usage-clock-${{ needs.resolve-version.outputs.version }}-linux.tar.gz`, run `./ai-usage-clock/ai-usage-clock`

            **Verify:** SHA256 sums live next to each archive.

            Builds are unsigned. Windows SmartScreen and macOS Gatekeeper may warn on first launch; see the [README FAQ](https://github.com/${{ github.repository }}/blob/${{ needs.resolve-version.outputs.tag }}/README.md#windows-smartscreen-or-macos-gatekeeper-warns-on-first-launch) for the per-OS first-launch steps.
          files: release/*
