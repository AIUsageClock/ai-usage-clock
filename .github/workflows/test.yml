name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, macos-26, ubuntu-22.04]
        python-version: ["3.14.10", "3.11.18"]
    env:
      # CI pins exact patch versions (see docs/build.md). The matrix version wins
      # over .python-version for every uv command in this job (uv sync and uv run
      # both read UV_PYTHON first), and uv may not fetch a different interpreter
      # than the one set up below.
      UV_PYTHON: ${{ matrix.python-version }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Set up Node.js 24.22.2 for extractor tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2

      - name: Confirm Node.js runtime
        run: node --version

      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3

      # Installs exactly what uv.lock pins into .venv; --frozen fails instead of
      # re-resolving when the lock and pyproject.toml disagree.
      - name: Install locked dependencies + dev extras
        run: uv sync --frozen --extra dev

      # The later steps run the interpreter in .venv as it is (--no-sync): no
      # re-sync, so what runs is what the lock installed.
      - name: Check version strings are in sync
        run: uv run --frozen --no-sync python tools/check_versions.py

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: uv run --frozen --no-sync python -m pytest -q

  mcp-helper-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, macos-26, ubuntu-22.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The CI Python is pinned to an exact patch release here (and in the other
      # python-version lines of the workflows); .python-version (3.14) is only for
      # local development. Upgrade steps: docs/build.md.
      - name: Set up Python 3.14.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Install locked dependencies + dev extras
        env:
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --extra dev

      # The same exclusions as the helper build in build.sh and build.ps1, so
      # that this smoke test exercises the executable that gets released (the
      # dev extras installed above would otherwise be packed into it).
      # tests/test_license_bundling.py keeps the three lists identical. A folded
      # scalar, so that it is one command line in any shell.
      - name: Build packaged MCP helper
        run: >-
          uv run --frozen --no-sync python -m PyInstaller --noconfirm --clean --console --onefile --noupx
          --name ai-usage-clock-mcp --exclude-module PIL
          --exclude-module pygments
          --exclude-module _pytest
          --exclude-module pytest
          --exclude-module yaml
          --exclude-module setuptools
          --exclude-module pkg_resources
          --exclude-module _distutils_hack
          --paths src
          pyinstaller_mcp_entry.py

      - name: Exercise packaged MCP handshake
        run: uv run --frozen --no-sync python tools/smoke_test_mcp.py dist/ai-usage-clock-mcp
