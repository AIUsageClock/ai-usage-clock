name: test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Set up Node.js 24 for extractor tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Confirm Node.js runtime
        run: node --version

      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-sync1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
              libnss3

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check version strings are in sync
        run: python tools/check_versions.py

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: localhost,127.0.0.1,::1
        run: pytest -q

  mcp-helper-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      # The same exclusions as the helper build in build.sh and build.ps1, so
      # that this smoke test exercises the executable that gets released (the
      # dev extras installed above would otherwise be packed into it).
      # tests/test_license_bundling.py keeps the three lists identical. A folded
      # scalar, so that it is one command line in any shell.
      - name: Build packaged MCP helper
        run: >-
          python -m PyInstaller --noconfirm --clean --console --onefile --noupx
          --name ai-usage-clock-mcp --exclude-module PIL
          --exclude-module pygments
          --exclude-module _pytest
          --exclude-module pytest
          --exclude-module yaml
          --exclude-module setuptools
          --exclude-module pkg_resources
          --exclude-module _distutils_hack
          --paths src
          pyinstaller_mcp_entry.py

      - name: Exercise packaged MCP handshake
        run: python tools/smoke_test_mcp.py dist/ai-usage-clock-mcp
